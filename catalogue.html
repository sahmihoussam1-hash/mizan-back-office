<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — Bijouterie Al Andalous</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">

        <!-- En-tête et menu -->
        <header class="site-header">
            <h1>Mizan</h1>
            <p class="subtitle">Bijouterie Al Andalous · Catalogue</p>
    <nav class="site-nav">
                <a href="index.html">Cours</a>
                <a href="catalogue.html" class="active">Catalogue</a>
            </nav>
        </header>
                <!-- Formulaire : ajouter un article -->
        <details class="form-card" id="form-section">
                        <summary id="form-title">Ajouter un article</summary>

            <form id="article-form" novalidate>
                <div class="form-group">
                    <label for="article-title">Titre</label>
                    <input type="text" id="article-title" autocomplete="off">
                    <p class="field-error" id="title-error"></p>
                </div>

                <div class="form-group">
                    <label for="article-description">Description</label>
                    <textarea id="article-description" rows="3"></textarea>
                    <p class="field-error" id="description-error"></p>
                </div>

                <div class="form-group">
                    <label for="article-price">Prix (MAD)</label>
                    <input type="number" id="article-price" step="0.01">
                    <p class="field-error" id="price-error"></p>
                </div>

                <div class="form-group">
                    <label for="article-status">Statut</label>
                    <select id="article-status" autocomplete="off">
                        <option value="available">Disponible</option>
                        <option value="reserved">Réservé</option>
                        <option value="sold">Vendu</option>
                    </select>
                </div>

                <button type="submit" id="article-submit">Ajouter l'article</button>
                                <button type="button" id="article-cancel" hidden>Annuler la modification</button>
            </form>
        </details>

        <!-- Recherche, filtre et tri -->
        <div class="catalogue-controls">
            <input type="search" id="search-input" placeholder="Rechercher un article...">

            <select id="status-filter">
                <option value="all">Tous les statuts</option>
                <option value="available">Disponible</option>
                <option value="reserved">Réservé</option>
                <option value="sold">Vendu</option>
            </select>

            <select id="sort-select">
                <option value="date-desc">Plus récents</option>
                <option value="title-asc">Titre (A → Z)</option>
                <option value="price-asc">Prix croissant</option>
                <option value="price-desc">Prix décroissant</option>
            </select>

            <button id="refresh-btn">Rafraîchir</button>
        </div>

        <!-- Bandeau hors-ligne (US-07), caché au départ -->
        <div id="offline-banner" hidden></div>

        <!-- Message : chargement, erreur ou succès -->
               <!-- Message : chargement ou erreur -->
        <div id="catalogue-status" hidden>
            <p id="catalogue-message"></p>
            <p id="catalogue-hint" hidden></p>
            <button id="catalogue-retry" hidden>Réessayer</button>
        </div>
        <p id="action-message" hidden></p>

        <!-- La liste des articles -->
        <div id="catalogue-container"></div>
                <!-- Bouton affiché quand la recherche ne trouve rien -->
        <div class="center">
            <button id="reset-filters" hidden>Réinitialiser les filtres</button>
        </div>

    </div>
    <!-- Fenêtre de confirmation (cachée au départ) -->
    <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <div class="modal-buttons">
                <button id="modal-cancel">Annuler</button>
                <button id="modal-confirm" class="btn-danger">Supprimer</button>
            </div>
        </div>
    </div>
    <!-- Fenêtre de détail d'un article (cachée au départ) -->
    <div id="detail-overlay" class="modal-overlay" hidden>
        <div class="modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <h3 id="detail-title">Détail de l'article</h3>
            <div id="detail-body"></div>
            <div class="modal-buttons">
                <button id="detail-retry" hidden>Réessayer</button>
                <button id="detail-close">Fermer</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/backoffice/app.js"></script>
</body>
</html>
